name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # See the matching comment in the Postgres copy's CI — this has to
      # happen before `composer install`, since its post-autoload-dump hook
      # boots the framework and needs a real BROADCAST_CONNECTION from .env
      # (missing entirely, it defaults to 'reverb' and fails on a null key).
      - name: Create .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        run: php artisan key:generate

      # phpunit.xml forces DB_CONNECTION=sqlite + DB_DATABASE=:memory: for the
      # whole suite, so no MySQL service container is needed here even though
      # this copy runs MySQL in production — same in-memory setup as the
      # Postgres copy's CI.
      - name: Run tests
        run: php artisan test
