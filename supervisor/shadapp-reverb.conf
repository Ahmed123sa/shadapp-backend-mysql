[program:shadapp-reverb]
; No process_num suffix here, unlike the queue worker: Reverb binds a TCP
; port, so exactly one process can run. numprocs is deliberately left at its
; default of 1 — raising it makes every extra process die immediately with
; "address already in use", and Supervisor will restart them forever.
process_name=%(program_name)s
command=php /path/to/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=__APP_USER__
redirect_stderr=true
stdout_logfile=/path/to/storage/logs/reverb.log
; Give open WebSocket connections a moment to close cleanly on restart
; instead of being severed mid-frame.
stopwaitsecs=10
