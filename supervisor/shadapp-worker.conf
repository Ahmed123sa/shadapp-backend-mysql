[program:shadapp-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/artisan queue:work --tries=3 --backoff=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Replaced by setup.sh with the account that actually owns the deployment.
; This used to be hardcoded to `forge`, which only exists on Laravel Forge
; servers — anywhere else Supervisor fails to start the program with a
; confusing "no such user" error.
user=__APP_USER__
numprocs=2
redirect_stderr=true
stdout_logfile=/path/to/storage/logs/worker.log
stopwaitsecs=10
